name: Run news pipeline

on:
  schedule:
    # 12:00 and 20:00 UTC (roughly 8am and 4pm US Eastern)
    - cron: "0 12,20 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline
        run: |
          curl -sf -X POST https://thisizatl.onrender.com/api/generate \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 280
