name: Run news pipeline

# Scheduling moved to cron-job.org (a dedicated, reliable scheduler) after
# GitHub Actions' own cron repeatedly failed to fire at all on some days --
# see git history for details. This workflow is kept only as a manual
# "run it right now" trigger from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline
        run: |
          curl -sf -X POST https://thisizatl.onrender.com/api/generate \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 280
